analysis:
  base-url: ${ANALYSIS_BASE_URL:http://localhost:8000}

qaima:
    cors:
      allowed-origin-patterns: ${QAIMA_CORS_ALLOWED_ORIGIN_PATTERNS:https://stockpt.ai.kr,https://www.stockpt.ai.kr}
    mail:
      from: ${QAIMA_MAIL_FROM:noreply@qaima.local}
      dry-run: ${QAIMA_MAIL_DRY_RUN:false}
    app:
      base-url: ${QAIMA_APP_BASE_URL:https://stockpt.ai.kr}

marketstack:
    base-url: ${MARKETSTACK_BASE_URL:https://api.marketstack.com/v2}
    access-key: ${MARKETSTACK_ACCESS_KEY}

kis:
    base-url: ${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}
    app-key: ${KIS_APP_KEY}
    app-secret: ${KIS_APP_SECRET}

news:
    naver:
      base-url: ${NAVER_NEWS_BASE_URL:https://openapi.naver.com/v1/search/news.json}
      client-id: ${NAVER_NEWS_CLIENT_ID}
      client-secret: ${NAVER_NEWS_CLIENT_SECRET}

jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}
    refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:2592000}

bok:
    api-key: ${BOK_API_KEY}

fred:
    base-url: ${FRED_BASE_URL:https://api.stlouisfed.org}
    api-key: ${FRED_API_KEY}

finra:
    base-url: ${FINRA_BASE_URL:https://cdn.finra.org}
    sync:
      enabled: ${FINRA_SYNC_ENABLED:true}
      daily-cron: "0 0 9 * * *"
      lookback-days: 7

krx:
    data:
      base-url: ${KRX_DATA_BASE_URL:https://data.krx.co.kr}
    short-selling:
      sync:
        enabled: ${KRX_SHORT_SELLING_SYNC_ENABLED:true}
        daily-cron: ${KRX_SHORT_SELLING_DAILY_CRON:0 30 18 * * MON-FRI}
        lookback-days: ${KRX_SHORT_SELLING_LOOKBACK_DAYS:5}

sec:
    edgar:
      base-url: ${SEC_EDGAR_BASE_URL:https://www.sec.gov}
      data-base-url: ${SEC_EDGAR_DATA_BASE_URL:https://data.sec.gov}
      user-agent: ${SEC_EDGAR_USER_AGENT}
    issued-shares:
      sync:
        enabled: ${SEC_ISSUED_SHARES_SYNC_ENABLED:true}
        daily-cron: "0 0 18 * * *"
        limit: ${SEC_ISSUED_SHARES_SYNC_LIMIT:300}
    form13f:
      source-dir: ${SEC_13F_SOURCE_DIR:}

opendart:
    base-url: ${OPENDART_BASE_URL:https://opendart.fss.or.kr/api}
    api-key: ${OPENDART_API_KEY}
    sync:
      enabled: ${OPENDART_SYNC_ENABLED:true}
      daily-cron: "0 10 3 * * *"

feature2:
    news:
      limit: ${FEATURE2_NEWS_LIMIT:15}
      article:
        max-in-memory-size-bytes: ${FEATURE2_NEWS_ARTICLE_MAX_IN_MEMORY_SIZE_BYTES:2097152}
      sentiment:
        model: ${FEATURE2_NEWS_SENTIMENT_MODEL:kf-deberta-sentiment-v2}
        timeout-seconds: ${FEATURE2_NEWS_SENTIMENT_TIMEOUT_SECONDS:30}

auth:
    cookie:
      refresh-token-name: qaima_refresh_token
      path: "/api/v1/auth"
      same-site: "Lax"
      secure: true
      http-only: true
    oauth2:
      success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:https://stockpt.ai.kr/login/oauth2/success}
      failure-redirect-url: ${OAUTH2_FAILURE_REDIRECT_URL:https://stockpt.ai.kr/login}

spring:
    main:
      web-application-type: reactive

    datasource:
      url: ${SPRING_DATASOURCE_URL}
      username: ${SPRING_DATASOURCE_USERNAME}
      password: ${SPRING_DATASOURCE_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQLDialect

    flyway:
      enabled: ${SPRING_FLYWAY_ENABLED:true}
      locations: classpath:db/migration
      baseline-on-migrate: false

    sql:
      init:
        mode: never

    data:
      redis:
        host: ${SPRING_DATA_REDIS_HOST:localhost}
        port: ${SPRING_DATA_REDIS_PORT:6379}
        timeout: 2s

    mail:
      host: ${SPRING_MAIL_HOST:smtp.gmail.com}
      port: ${SPRING_MAIL_PORT:587}
      username: ${SPRING_MAIL_USERNAME:}
      password: ${SPRING_MAIL_PASSWORD:}
      properties:
        mail:
          debug: ${SPRING_MAIL_DEBUG:false}
          smtp:
            auth: true
            starttls:
              enable: true
              required: true
            ssl:
              trust: smtp.gmail.com
            connectiontimeout: 5000
            timeout: 5000
            writetimeout: 5000

    email-verification:
      token-ttl-minutes: ${EMAIL_VERIFICATION_TOKEN_TTL_MINUTES:5}

    security:
      oauth2:
        client:
          registration:
            google:
              client-id: ${GOOGLE_CLIENT_ID:}
              client-secret: ${GOOGLE_CLIENT_SECRET:}
              scope:
                - openid
                - profile
                - email
            kakao:
              client-id: ${KAKAO_CLIENT_ID:}
              client-secret: ${KAKAO_CLIENT_SECRET:}
              client-authentication-method: client_secret_post
              authorization-grant-type: authorization_code
              redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
              scope:
                - account_email
                - profile_nickname
            naver:
              client-id: ${NAVER_OAUTH_CLIENT_ID:}
              client-secret: ${NAVER_OAUTH_CLIENT_SECRET:}
              client-authentication-method: client_secret_post
              authorization-grant-type: authorization_code
              redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          provider:
            kakao:
              authorization-uri: https://kauth.kakao.com/oauth/authorize
              token-uri: https://kauth.kakao.com/oauth/token
              user-info-uri: https://kapi.kakao.com/v2/user/me
              user-name-attribute: id
            naver:
              authorization-uri: https://nid.naver.com/oauth2.0/authorize
              token-uri: https://nid.naver.com/oauth2.0/token
              user-info-uri: https://openapi.naver.com/v1/nid/me
              user-name-attribute: response

kis-batch:
    rate-limit:
      max-requests-per-second: ${KIS_BATCH_MAX_REQUESTS_PER_SECOND:10}
    industry-index-ohlcv:
      enabled: ${KIS_BATCH_INDUSTRY_INDEX_OHLCV_ENABLED:true}
      daily-cron: "0 10 18 * * MON-FRI"
      lookback-days: 1095
      refresh-tail-days: 10
      limit: 0
    market-investor-flow:
      enabled: ${KIS_BATCH_MARKET_INVESTOR_FLOW_ENABLED:true}
      daily-cron: "0 30 16 * * MON-FRI"
      lookback-days: 30
      refresh-tail-days: 10
      retry:
        max-attempts: 2
        delay-ms: 2000
    stock-investor-flow:
      enabled: ${KIS_BATCH_STOCK_INVESTOR_FLOW_ENABLED:true}
      daily-cron: "0 0 19 * * MON-FRI"
      lookback-days: 30
      refresh-tail-days: 10
      limit: 300
      sleep-ms: 300
      retry:
        max-attempts: 2
        delay-ms: 2000

logging:
    level:
      reactor.netty.http.client: INFO
      org.springframework.web.reactive.function.client: INFO
      org.springframework: INFO
      com.qaima: INFO
