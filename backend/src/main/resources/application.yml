analysis:
  base-url: "http://localhost:8000"

qaima:
  cors:
    allowed-origin-patterns: ${QAIMA_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://localhost:3000,https://localhost:5173,https://localhost:3000}

fred:
  base-url: "https://api.stlouisfed.org"
  api-key: ${FRED_API_KEY:}
finra:
  base-url: "https://cdn.finra.org"
  sync:
    enabled: true
    daily-cron: "0 0 9 * * *"
    lookback-days: 7

krx:
  data:
    base-url: "https://data.krx.co.kr"
  short-selling:
    sync:
      enabled: true
      daily-cron: "0 30 18 * * MON-FRI"
      lookback-days: 5

sec:
  edgar:
    base-url: "https://www.sec.gov"
    data-base-url: "https://data.sec.gov"
    user-agent: ${SEC_EDGAR_USER_AGENT:qaima-dev contact@example.com}
  issued-shares:
    sync:
      enabled: true
      daily-cron: "0 0 18 * * *"
      limit: 300
  form13f:
    source-dir: ${SEC_13F_SOURCE_DIR:}

feature2:
  news:
    article:
      max-in-memory-size-bytes: ${FEATURE2_NEWS_ARTICLE_MAX_IN_MEMORY_SIZE_BYTES:2097152}
    sentiment:
      model: ${FEATURE2_NEWS_SENTIMENT_MODEL:kf-deberta-sentiment-v2}
      timeout-seconds: ${FEATURE2_NEWS_SENTIMENT_TIMEOUT_SECONDS:30}

auth:
  cookie:
    refresh-token-name: qaima_refresh_token
    path: "/api/v1/auth"
    same-site: "Lax"
    secure: false
    http-only: true
  oauth2:
    success-redirect-url: "http://localhost:5173/login/oauth2/success"
    failure-redirect-url: "http://localhost:5173/login"

opendart:
  base-url: "https://opendart.fss.or.kr/api"
  sync:
    enabled: true
    daily-cron: "0 10 3 * * *"

kis-batch:
  rate-limit:
    # KIS API policy: stay below 15 requests/sec. Use 10/sec as the operational safety ceiling.
    max-requests-per-second: 10
  industry-index-ohlcv:
    enabled: true
    daily-cron: "0 10 18 * * MON-FRI"
    lookback-days: 1095
    refresh-tail-days: 10
    limit: 0
  market-investor-flow:
    enabled: true
    daily-cron: "0 30 16 * * MON-FRI"
    lookback-days: 30
    refresh-tail-days: 10
    retry:
      max-attempts: 2
      delay-ms: 2000
  stock-investor-flow:
    enabled: true
    daily-cron: "0 0 19 * * MON-FRI"
    lookback-days: 30
    refresh-tail-days: 10
    limit: 300
    sleep-ms: 300
    retry:
      max-attempts: 2
      delay-ms: 2000

spring:
  profiles:
    active: mysql #h2 <-> mysql 변경해서 사용

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${security.oauth2.client.registration.google.client-id:${GOOGLE_CLIENT_ID:google-client-id}}
            client-secret: ${security.oauth2.client.registration.google.client-secret:${GOOGLE_CLIENT_SECRET:google-client-secret}}
            scope:
              - openid
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:kakao-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - account_email
              - profile_nickname
          naver:
            client-id: ${security.oauth2.client.registration.naver.client-id:${NAVER_CLIENT_ID:naver-client-id}}
            client-secret: ${security.oauth2.client.registration.naver.client-secret:${NAVER_CLIENT_SECRET:naver-client-secret}}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE

  config:
    import: optional:application-secret.yml

  jpa:
    hibernate:
      ddl-auto: validate

  sql:
    init:
      mode: never

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

logging:
  level:
    reactor.netty.http.client: DEBUG
    org.springframework.web.reactive.function.client: TRACE
    org.springframework: DEBUG
    com.qaima: DEBUG
